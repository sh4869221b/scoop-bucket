name: Test published maintenance commit

on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
      published_ref:
        required: true
        type: string

permissions: {}

jobs:
  tests:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      revision: ${{ inputs.revision }}
      published_ref: ${{ inputs.published_ref }}

  status:
    name: Report Tests on published commit
    needs: tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Publish commit status
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ inputs.revision }}
          RESULT: ${{ needs.tests.result }}
        run: |
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          state=failure
          if [[ "$RESULT" == success ]]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$REVISION" \
            -f "state=$state" -f 'context=Tests / maintenance' \
            -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
