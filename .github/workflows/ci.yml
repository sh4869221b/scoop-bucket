name: Tests

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Manifests (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: my_bucket
          persist-credentials: false
      - name: Checkout Scoop schema and validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScoopInstaller/Scoop
          ref: e6aa3b366bdee8ed138c1e0f7b85192ebdd35d0f # v0.6.0
          path: scoop_core
          persist-credentials: false
      - name: Install pinned Pester
        run: |
          ./my_bucket/bin/install-test-dependencies.ps1
      - name: Test every manifest and script
        run: |
          $env:SCOOP_HOME = Convert-Path ./scoop_core
          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"
          ./my_bucket/bin/test.ps1
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.shell }}
          path: my_bucket/TestResults.xml
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Nico Windows install and uninstall
    # Only trusted default-branch commits may download and execute package binaries.
    # PRs still receive all static/schema/unit tests above, with a read-only token.
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: my_bucket
          persist-credentials: false
      - name: Checkout pinned Scoop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScoopInstaller/Scoop
          ref: e6aa3b366bdee8ed138c1e0f7b85192ebdd35d0f # v0.6.0
          path: scoop_core
          persist-credentials: false
      - name: Install pinned Pester
        run: |
          ./my_bucket/bin/install-test-dependencies.ps1
      - name: Test only the Nico CLI releases
        run: |
          $env:SCOOP_HOME = Convert-Path ./scoop_core
          ./my_bucket/bin/test.ps1 -TestPath ./my_bucket/tests/smoke -ResultPath ./my_bucket/SmokeResults.xml
      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nico-install-results
          path: my_bucket/SmokeResults.xml
          if-no-files-found: error
          retention-days: 14
