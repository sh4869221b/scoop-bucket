name: Commented Pull Request

on:
  issue_comment:
    types: [created]

# Comments and fork manifests are untrusted. Never run their scripts here.
permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/verify')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout, Scoop action, package download, or PR-controlled executable.
      - name: Validate changed manifest JSON without executing it
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          
          def get(path):
              request = urllib.request.Request(
                  "https://api.github.com/" + path,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as source:
              event = json.load(source)
          repo = os.environ["GITHUB_REPOSITORY"]
          number = int(event["issue"]["number"])
          pr = get(f"repos/{repo}/pulls/{number}")
          head = pr["head"]
          head_repo = head["repo"]["full_name"]
          sha = head["sha"]
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", head_repo):
              raise ValueError("Invalid head repository")
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise ValueError("Invalid head SHA")
          files = []
          for page in range(1, 31):
              batch = get(f"repos/{repo}/pulls/{number}/files?per_page=100&page={page}")
              files.extend(batch)
              if len(batch) < 100:
                  break
          if len(files) != pr["changed_files"]:
              raise ValueError("Incomplete changed-file listing; use the Tests workflow")
          checked = 0
          for item in files:
              path = item["filename"]
              if item["status"] == "removed" or not (path.startswith("bucket/") and path.endswith(".json")):
                  continue
              quoted = urllib.parse.quote(path, safe="/")
              content = get(f"repos/{head_repo}/contents/{quoted}?ref={sha}")
              if content.get("type") != "file" or content.get("encoding") != "base64":
                  raise ValueError("Manifest is not a supported regular text file")
              manifest = json.loads(base64.b64decode(content["content"], validate=False).decode("utf-8-sig"))
              if not isinstance(manifest, dict):
                  raise ValueError("Manifest must be a JSON object")
              checked += 1
          # Detect pushes while the changed-file list was being fetched.
          if get(f"repos/{repo}/pulls/{number}")["head"]["sha"] != sha:
              raise ValueError("PR head changed during validation; retry /verify")
          print(f"Validated JSON syntax for {checked} changed manifests at {sha}.")
          print("No manifest scripts were executed. Use the Tests workflow for schema and unit checks.")
